<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تقييم الفعاليات</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    *{box-sizing:border-box}
    :root{
      --primary:#0e4b4d;
      --primary-dark:#08393b;
      --primary-soft:#edf6f4;
      --gold:#b9964c;
      --gold-soft:#fbf7ed;
      --bg:#f2f6f5;
      --card:#fff;
      --text:#173f42;
      --muted:#6c7d7f;
      --border:#d8e3e1;
      --danger:#a94442;
      --success:#287348;
      --shadow:0 14px 38px rgba(10,57,59,.08);
    }

    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 12% 8%,rgba(185,150,76,.10),transparent 25%),
        radial-gradient(circle at 88% 15%,rgba(14,75,77,.08),transparent 28%),
        linear-gradient(135deg,#eef5f3,#fbfaf6 50%,#eef4f2);
      min-height:100vh;
    }

    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    .hidden{display:none!important}

    .page{
      width:min(1180px,calc(100% - 28px));
      margin:24px auto 50px;
    }

    .topbar{
      background:#fff;
      border:1px solid rgba(14,75,77,.15);
      border-radius:20px;
      box-shadow:var(--shadow);
      padding:18px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      position:relative;
      overflow:hidden;
    }

    .topbar::before{
      content:"";
      position:absolute;
      top:0;right:0;left:0;height:4px;
      background:linear-gradient(90deg,var(--primary-dark),var(--gold),var(--primary));
    }

    .title-wrap h1{
      margin:0 0 5px;
      font-size:1.55rem;
      color:var(--primary-dark);
    }

    .title-wrap p{
      margin:0;
      color:var(--muted);
      font-size:.86rem;
      line-height:1.7;
    }

    .actions{display:flex;gap:8px;flex-wrap:wrap}

    .btn{
      border:0;
      border-radius:10px;
      padding:10px 15px;
      font-weight:700;
    }

    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:var(--primary-dark)}
    .btn-soft{background:#fff;border:1px solid var(--border);color:var(--primary)}
    .btn-gold{background:var(--gold-soft);border:1px solid #e8d9b0;color:#725b2c}
    .btn-danger{background:#fff5f5;border:1px solid #e9caca;color:var(--danger)}
    .btn-danger:hover{background:#fdeaea}

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
      margin:16px 0;
    }

    .stat{
      background:#fff;
      border:1px solid var(--border);
      border-radius:15px;
      padding:16px;
      box-shadow:0 7px 20px rgba(10,57,59,.04);
    }

    .stat span{
      display:block;
      color:var(--muted);
      font-size:.76rem;
      margin-bottom:8px;
    }

    .stat strong{
      font-size:1.65rem;
      color:var(--primary-dark);
    }

    .section{
      background:#fff;
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:18px;
    }

    .section-head{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      margin-bottom:14px;
    }

    .section-head h2{
      margin:0;
      font-size:1.05rem;
      color:var(--primary-dark);
    }

    .events-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
    }

    .event-card{
      border:1px solid var(--border);
      border-radius:14px;
      padding:15px;
      background:linear-gradient(135deg,#fff,#fbfdfc);
    }

    .event-card h3{
      margin:0 0 7px;
      font-size:1rem;
      color:var(--primary-dark);
      line-height:1.6;
    }

    .event-desc{
      color:var(--muted);
      font-size:.78rem;
      line-height:1.7;
      margin:0;
    }

    .badges{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      margin-top:10px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      padding:5px 8px;
      border-radius:999px;
      font-size:.7rem;
      font-weight:700;
      background:var(--primary-soft);
      color:var(--primary);
    }

    .badge.draft{background:#f5f0e4;color:#7a6536}
    .badge.published{background:#e8f5ed;color:#287348}
    .badge.closed{background:#f3eeee;color:#825252}

    .event-actions{
      margin-top:13px;
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      border-top:1px solid #edf1f0;
      padding-top:11px;
    }

    .event-actions .btn{
      padding:8px 10px;
      font-size:.73rem;
    }

    .empty,.loading,.error{
      text-align:center;
      padding:34px 16px;
      color:var(--muted);
      border:1px dashed var(--border);
      border-radius:12px;
      background:#fbfdfc;
      grid-column:1/-1;
      line-height:1.8;
    }

    .error{color:var(--danger);background:#fffafa}

    .modal-backdrop{
      position:fixed;
      inset:0;
      background:rgba(7,35,37,.42);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
      z-index:1000;
    }

    .modal{
      width:min(560px,100%);
      background:#fff;
      border-radius:18px;
      box-shadow:0 25px 75px rgba(0,0,0,.18);
      overflow:hidden;
    }

    .modal-head{
      padding:16px 18px;
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .modal-head h3{margin:0;font-size:1rem}
    .close-btn{border:0;background:transparent;font-size:1.3rem;color:var(--muted)}

    .modal-body{padding:18px}
    .field{margin-bottom:13px}
    .field label{
      display:block;
      font-weight:700;
      font-size:.78rem;
      margin-bottom:6px;
    }
    .field input,.field textarea,.field select{
      width:100%;
      border:1px solid #cfddda;
      border-radius:9px;
      padding:10px 11px;
      outline:none;
      background:#fff;
      color:var(--text);
    }
    .field textarea{min-height:85px;resize:vertical}
    .field input:focus,.field textarea:focus,.field select:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 2px rgba(14,75,77,.07);
    }

    .modal-actions{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      padding-top:5px;
    }

    .message{
      margin-bottom:12px;
      border-radius:9px;
      padding:9px 10px;
      font-size:.76rem;
      font-weight:700;
    }
    .message.error{color:var(--danger);background:#fbeeed;border:1px solid #efd2cf}

    @media(max-width:800px){
      .stats{grid-template-columns:repeat(2,1fr)}
      .events-grid{grid-template-columns:1fr}
      .topbar{align-items:flex-start;flex-direction:column}
    }

    @media(max-width:480px){
      .page{width:calc(100% - 14px);margin-top:8px}
      .stats{grid-template-columns:1fr 1fr}
      .title-wrap h1{font-size:1.28rem}
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="title-wrap">
        <h1>تقييم الفعاليات الذكي</h1>
        <p>إنشاء التقييمات، إعداد الأسئلة، نشر الرابط ومتابعة عدد الاستجابات.</p>
      </div>

      <div class="actions">
        <button class="btn btn-soft" type="button" onclick="location.href='app.html'">العودة للمنصة</button>
        <button id="newEvaluationBtn" class="btn btn-primary" type="button">＋ إنشاء تقييم جديد</button>
      </div>
    </header>

    <section class="stats">
      <article class="stat"><span>إجمالي التقييمات</span><strong id="statTotal">0</strong></article>
      <article class="stat"><span>التقييمات المنشورة</span><strong id="statPublished">0</strong></article>
      <article class="stat"><span>المسودات</span><strong id="statDraft">0</strong></article>
      <article class="stat"><span>إجمالي الاستجابات</span><strong id="statResponses">0</strong></article>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>التقييمات</h2>
      </div>
      <div id="eventsGrid" class="events-grid">
        <div class="loading">جاري تحميل التقييمات...</div>
      </div>
    </section>
  </div>

  <div id="createModal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-head">
        <h3>إنشاء تقييم جديد</h3>
        <button id="closeModalBtn" class="close-btn" type="button">×</button>
      </div>

      <form id="createForm" class="modal-body">
        <div id="createMessage" class="message error hidden"></div>

        <div class="field">
          <label for="eventTitle">اسم الفعالية *</label>
          <input id="eventTitle" type="text" maxlength="180" required>
        </div>

        <div class="field">
          <label for="targetAudience">الفئة المستهدفة *</label>
          <select id="targetAudience" required>
            <option value="">اختاري الفئة...</option>
            <option>الطلبة</option>
            <option>أولياء الأمور</option>
            <option>المعلمات</option>
            <option>الهيئة الإدارية</option>
            <option>الهيئة التعليمية</option>
            <option>أخرى</option>
          </select>
        </div>

        <div class="field">
          <label for="eventDescription">وصف مختصر للفعالية</label>
          <textarea id="eventDescription" maxlength="800"></textarea>
        </div>

        <div class="modal-actions">
          <button id="cancelCreateBtn" class="btn btn-soft" type="button">إلغاء</button>
          <button id="saveEventBtn" class="btn btn-primary" type="submit">إنشاء التقييم</button>
        </div>
      </form>
    </div>
  </div>

<script>
  const sb = supabase.createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseKey);

  let currentUser = null;
  let events = [];
  let submissions = [];

  document.addEventListener("DOMContentLoaded", init);

  async function init(){
    const {data:{session},error} = await sb.auth.getSession();

    if(error || !session){
      location.href = "index.html";
      return;
    }

    currentUser = session.user;

    document.getElementById("newEvaluationBtn").addEventListener("click",openCreateModal);
    document.getElementById("closeModalBtn").addEventListener("click",closeCreateModal);
    document.getElementById("cancelCreateBtn").addEventListener("click",closeCreateModal);
    document.getElementById("createForm").addEventListener("submit",createEvaluation);

    document.getElementById("createModal").addEventListener("click",e=>{
      if(e.target.id === "createModal") closeCreateModal();
    });

    await loadData();
  }

  async function loadData(){
    const grid = document.getElementById("eventsGrid");
    grid.innerHTML = `<div class="loading">جاري تحميل التقييمات...</div>`;

    try{
      const eventsResult = await sb
        .from("evaluation_events")
        .select("*")
        .order("created_at",{ascending:false});

      if(eventsResult.error) throw eventsResult.error;

      const submissionsResult = await sb
        .from("evaluation_submissions")
        .select("id,event_id,submitted_at");

      if(submissionsResult.error) throw submissionsResult.error;

      events = eventsResult.data || [];
      submissions = submissionsResult.data || [];

      renderStats();
      renderEvents();
    }catch(error){
      console.error("Load evaluations error:",error);
      grid.innerHTML = `<div class="error">تعذر تحميل التقييمات في الوقت الحالي.</div>`;
    }
  }

  function renderStats(){
    document.getElementById("statTotal").textContent = events.length;
    document.getElementById("statPublished").textContent =
      events.filter(e=>e.status === "published").length;
    document.getElementById("statDraft").textContent =
      events.filter(e=>e.status === "draft").length;
    document.getElementById("statResponses").textContent = submissions.length;
  }

  function renderEvents(){
    const grid = document.getElementById("eventsGrid");

    if(!events.length){
      grid.innerHTML = `
        <div class="empty">
          لا توجد تقييمات حتى الآن.<br>
          اضغطي «إنشاء تقييم جديد» للبدء.
        </div>`;
      return;
    }

    grid.innerHTML = events.map(event=>{
      const count = submissions.filter(s=>s.event_id === event.id).length;
      const statusText =
        event.status === "published" ? "منشور" :
        event.status === "closed" ? "مغلق" : "مسودة";

      const publicUrl = event.public_token
        ? `evaluation-form.html?t=${encodeURIComponent(event.public_token)}`
        : "";

      return `
        <article class="event-card">
          <h3>${escapeHtml(event.title)}</h3>
          <p class="event-desc">${event.description ? escapeHtml(event.description) : "لا يوجد وصف مضاف."}</p>

          <div class="badges">
            <span class="badge">${escapeHtml(event.target_audience || "غير محددة")}</span>
            <span class="badge ${escapeHtml(event.status)}">${statusText}</span>
            <span class="badge">الاستجابات: ${count}</span>
          </div>

          <div class="event-actions">
            <button class="btn btn-soft" type="button"
              onclick="location.href='evaluation-create.html?id=${encodeURIComponent(event.id)}'">
              إعداد الأسئلة
            </button>

            ${
              event.status === "published" && publicUrl
                ? `
                  <button class="btn btn-primary" type="button"
                    onclick="window.open('${publicUrl}','_blank')">
                    فتح نموذج التقييم
                  </button>

                  <button class="btn btn-gold" type="button"
                    onclick="copyPublicLink('${escapeJs(publicUrl)}',this)">
                    نسخ الرابط
                  </button>

                  <button class="btn btn-soft" type="button"
                    onclick="printBlankEvaluation('${escapeJs(publicUrl)}')">
                    طباعة الاستمارة
                  </button>
                `
                : ""
            }

            <button class="btn btn-soft" type="button"
              onclick="location.href='evaluation-results.html?id=${encodeURIComponent(event.id)}'">
              النتائج
            </button>

            <button class="btn btn-danger" type="button"
              onclick="deleteEvaluation('${event.id}','${escapeJs(event.title)}',this)">
              حذف التقييم
            </button>
          </div>
        </article>
      `;
    }).join("");
  }

  function openCreateModal(){
    document.getElementById("createMessage").classList.add("hidden");
    document.getElementById("createForm").reset();
    document.getElementById("createModal").classList.remove("hidden");
    setTimeout(()=>document.getElementById("eventTitle").focus(),50);
  }

  function closeCreateModal(){
    document.getElementById("createModal").classList.add("hidden");
  }

  async function createEvaluation(e){
    e.preventDefault();

    const title = document.getElementById("eventTitle").value.trim();
    const targetAudience = document.getElementById("targetAudience").value;
    const description = document.getElementById("eventDescription").value.trim();
    const message = document.getElementById("createMessage");
    const btn = document.getElementById("saveEventBtn");

    message.classList.add("hidden");
    message.textContent = "";

    if(!title || !targetAudience){
      message.textContent = "يرجى إدخال اسم الفعالية واختيار الفئة المستهدفة.";
      message.classList.remove("hidden");
      return;
    }

    btn.disabled = true;
    btn.textContent = "جاري الإنشاء...";

    try{
      const {data,error} = await sb
        .from("evaluation_events")
        .insert({
          title,
          target_audience:targetAudience,
          description:description || null,
          status:"draft",
          created_by:currentUser.id
        })
        .select("*")
        .single();

      if(error) throw error;

      closeCreateModal();
      location.href = `evaluation-create.html?id=${encodeURIComponent(data.id)}`;
    }catch(error){
      console.error("Create evaluation error:",error);
      message.textContent = "تعذر إنشاء التقييم. يرجى المحاولة مرة أخرى.";
      message.classList.remove("hidden");
      btn.disabled = false;
      btn.textContent = "إنشاء التقييم";
    }
  }

  async function deleteEvaluation(eventId,eventTitle,btn){
    const ok = confirm(
      `هل أنتِ متأكدة من حذف التقييم "${eventTitle}"؟\n\n` +
      `سيتم حذف التقييم والأسئلة والاستجابات والنتائج وإعدادات التقرير المرتبطة به نهائيًا، ولا يمكن التراجع عن العملية.`
    );

    if(!ok) return;

    const secondOk = confirm(
      `تأكيد أخير:\nسيتم الحذف النهائي للتقييم "${eventTitle}".\nهل تريدين المتابعة؟`
    );

    if(!secondOk) return;

    const oldText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "جاري الحذف...";

    try{
      const {error} = await sb
        .from("evaluation_events")
        .delete()
        .eq("id",eventId);

      if(error) throw error;

      events = events.filter(e=>e.id !== eventId);
      submissions = submissions.filter(s=>s.event_id !== eventId);

      renderStats();
      renderEvents();

      alert("تم حذف التقييم وجميع البيانات المرتبطة به بنجاح.");
    }catch(error){
      console.error("Delete evaluation error:",error);
      alert("تعذر حذف التقييم. لم يتم حذف أي شيء.");
      btn.disabled = false;
      btn.textContent = oldText;
    }
  }

  function printBlankEvaluation(relativeUrl){
    const url = new URL(relativeUrl, location.href);
    url.searchParams.set("print", "1");
    window.open(url.href, "_blank");
  }

  async function copyPublicLink(relativeUrl,btn){
    const url = new URL(relativeUrl,location.href).href;
    try{
      await navigator.clipboard.writeText(url);
      const old = btn.textContent;
      btn.textContent = "تم النسخ ✓";
      setTimeout(()=>btn.textContent=old,1500);
    }catch{
      prompt("انسخي رابط التقييم:",url);
    }
  }
function escapeHtml(value){
    return String(value ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function escapeJs(value){
    return String(value ?? "")
      .replaceAll("\\","\\\\")
      .replaceAll("'","\\'");
  }
</script>
</body>
</html>
